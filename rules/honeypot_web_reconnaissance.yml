title: Suspicious Web Path Probe Against Decoy Web Service
id: 7b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: test
description: Detects HTTP requests seeking known sensitive files and administrative interfaces (.env files, phpMyAdmin, WordPress login) on decoy web applications.
author: Honeypot Defense Lab
date: 2026-10-28
references:
    - https://attack.mitre.org/techniques/T1595/002/
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: webserver
    product: honeypot
detection:
    selection:
        path|contains:
            - '/.env'
            - '/wp-login.php'
            - '/phpmyadmin'
            - '/internal-backup'
            - '/api/v1/debug'
    condition: selection
falsepositives:
    - None in a decoy environment.
level: high
