title: Honeypot Multi-Protocol Credential Guessing
id: 6a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
status: test
description: Detects authentication attempts captured by decoy honeypot services (SSH, HTTP, FTP). Since no legitimate user has credentials for these decoy systems, all authentication attempts represent attacker credential stuffing or brute force.
author: Honeypot Defense Lab
date: 2026-10-28
references:
    - https://attack.mitre.org/techniques/T1110/001/
    - https://attack.mitre.org/techniques/T1110/004/
tags:
    - attack.credential_access
    - attack.t1110.001
    - attack.t1110.004
logsource:
    category: application
    product: honeypot
detection:
    selection:
        event_type:
            - 'AUTH_ATTEMPT'
            - 'CREDENTIAL_SUBMISSION'
    condition: selection
falsepositives:
    - None. Decoy services have no valid business users.
level: critical
